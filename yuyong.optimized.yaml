# Mihomo 独立配置；HTTP/SOCKS 端口沿用原配置。
# 控制接口仅监听本机；策略组选择会持久化保存。
# 公司内部域名可在 nameserver-policy 中补充实际内网 DNS。
allow-lan: false
bind-address: 127.0.0.1
port: 7890
socks-port: 7891
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver: &1
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver: *1
  nameserver-policy:
    rule-set:proxy: &2
    - "https://1.1.1.1/dns-query#\U0001F680 节点选择"
    - "https://8.8.8.8/dns-query#\U0001F680 节点选择"
    rule-set:google: *2

