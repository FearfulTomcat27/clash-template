# 远程规则使用独立缓存目录；BT 进程规则随配置保存。
rule-providers:
  bt-apps:
    type: inline
    behavior: classical
    format: yaml
    payload:
    - PROCESS-NAME,qBittorrent
    - PROCESS-NAME,qbittorrent
    - PROCESS-NAME,qbittorrent.exe
    - PROCESS-NAME,qbittorrent-nox
    - PROCESS-NAME,Transmission
    - PROCESS-NAME,transmission-daemon
    - PROCESS-NAME,transmission-daemon.exe
    - PROCESS-NAME,transmission-qt.exe
    - PROCESS-NAME,uTorrent
    - PROCESS-NAME,uTorrent.exe
    - PROCESS-NAME,BitComet
    - PROCESS-NAME,BitComet.exe
    - PROCESS-NAME,BitComet_x64.exe
    - PROCESS-NAME,WebTorrent
    - PROCESS-NAME,WebTorrent.exe
  apple:
    behavior: domain
    interval: 86400
    path: "./ruleset/yuyong-optimized/apple.yaml"
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
    format: yaml
  cncidr:
    behavior: ipcidr
    interval: 86400
    path: "./ruleset/yuyong-optimized/cncidr.yaml"
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    format: yaml
  direct:
    behavior: domain
    interval: 86400
    path: "./ruleset/yuyong-optimized/direct.yaml"
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    format: yaml
  google:
    behavior: domain
    interval: 86400
    path: "./ruleset/yuyong-optimized/google.yaml"
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    format: yaml
  icloud:
    behavior: domain
    interval: 86400
    path: "./ruleset/yuyong-optimized/icloud.yaml"
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt
    format: yaml
  lancidr:
    behavior: ipcidr
    interval: 86400
